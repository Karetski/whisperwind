[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisperwind"
dynamic = ["version"]
description = "Terminal-first, harness-agnostic workflow orchestrator for AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexey Karetski" }]
requires-python = ">=3.11"
dependencies = [
    "fastjsonschema>=2.19",
    "grandalf>=0.8",
    "ruamel-yaml>=0.19",
    "textual>=6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/Karetski/whisperwind"
Issues = "https://github.com/Karetski/whisperwind/issues"

[project.scripts]
whisperwind = "whisperwind.cli:run"
whw = "whisperwind.cli:run"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/whisperwind/__init__.py"

[tool.hatch.build.targets.sdist]
# Agent and CI configuration, and the repository's own Whisperwind project, are for
# working on the repository, not for users.
exclude = [".claude", ".github", "/.whisperwind", "/flows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
addopts = ["--strict-markers", "-m", "not live"]
markers = ["live: runs a real harness and spends money; opt in with WHISPERWIND_LIVE=1 -m live"]

[tool.ruff]
target-version = "py311"
line-length = 100
# .claude/ is vendored from agentkit.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Docs and messages use typographic dashes and arrows on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests hold whole flows in string literals.
"tests/*" = ["E501"]
# Textual declares BINDINGS and CSS as class-level lists.
"src/whisperwind/tui/*" = ["RUF012"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "tools"]
mypy_path = ["tools"]

[[tool.mypy.overrides]]
module = ["fastjsonschema", "fastjsonschema.*", "grandalf", "grandalf.*"]
ignore_missing_imports = true

# Runtime dependencies must carry a compatible license (VISION.md §10.4). CI runs
# pip-licenses against a fresh environment holding only the built wheel; names
# match exactly, as SPDX IDs or trove classifiers, so an unrecognized license fails.
[tool.pip-licenses]
from = "mixed"
allow-only = """\
MIT;MIT License;\
BSD-2-Clause;BSD-3-Clause;BSD License;\
Apache-2.0;Apache Software License;\
MPL-2.0;Mozilla Public License 2.0 (MPL 2.0);\
LGPL-2.1-or-later;LGPL-3.0-or-later;\
GNU Lesser General Public License v2 or later (LGPLv2+);\
GNU Lesser General Public License v3 or later (LGPLv3+);\
PSF-2.0;Python Software Foundation License;\
EPL-1.0;Eclipse Public License 1.0 (EPL-1.0)"""
# grandalf is licensed "GPLv2 | EPLv1" and is used under EPL-1.0, but its classifier
# names only GPLv2.
ignore-packages = ["grandalf"]
