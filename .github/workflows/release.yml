name: Release

# Pushing a tag vX.Y.Z publishes that version: the wheel and sdist
# to PyPI through trusted publishing, and a GitHub release with them
# attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: The tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/whisperwind/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - run: uv sync --locked
      - run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Every runtime dependency has a compatible license
        run: |
          uv venv /tmp/licenses
          uv pip install --python /tmp/licenses dist/*.whl
          uvx pip-licenses==5.5.5 --python /tmp/licenses/bin/python

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  wheels:
    needs: build
    strategy:
      matrix:
        # The tier-1 platforms: manylinux x86_64, manylinux aarch64, macOS arm64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Every runtime dependency installs from a wheel
        run: |
          uv venv --python ${{ matrix.python }} /tmp/wheels
          uv pip install --python /tmp/wheels --only-binary :all: dist/*.whl
          /tmp/wheels/bin/whw --version

  pypi:
    needs: [build, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/whisperwind
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Whisperwind ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
