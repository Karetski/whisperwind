name: Release

# Pushing a tag vX.Y.Z publishes that version: the wheel and sdist
# to PyPI through trusted publishing, and a GitHub release with them and
# whisperwind.pyz attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        id: py311
        with:
          python-version: "3.11"

      - name: The tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/whisperwind/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - run: uv sync --locked
      - run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Every runtime dependency is pure Python
        run: |
          uv venv /tmp/pure
          uv pip install --python /tmp/pure dist/*.whl
          /tmp/pure/bin/python tools/check_pure_python.py

      - name: Build the zipapp and run it on Python 3.11
        run: |
          uv run python tools/build_zipapp.py dist/whisperwind-*.whl pyz/whisperwind.pyz
          "${{ steps.py311.outputs.python-path }}" pyz/whisperwind.pyz --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: pyz
          path: pyz/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/whisperwind
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Whisperwind ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
