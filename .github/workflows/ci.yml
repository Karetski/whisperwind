name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build sdist and wheel
        run: uv build

      - name: Every runtime dependency has a compatible license
        run: |
          uv venv /tmp/licenses
          uv pip install --python /tmp/licenses dist/*.whl
          uvx pip-licenses==5.5.5 --python /tmp/licenses/bin/python

      - name: Installs with pipx
        run: |
          pipx install dist/*.whl
          whisperwind --version
          whw --version
          pipx uninstall whisperwind

      - name: Installs with uv tool
        run: |
          uv tool install dist/*.whl
          whisperwind --version
          whw --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  wheels:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        # The tier-1 platforms: manylinux x86_64, manylinux aarch64, macOS arm64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Every runtime dependency installs from a wheel
        run: |
          uv venv --python ${{ matrix.python }} /tmp/wheels
          uv pip install --python /tmp/wheels --only-binary :all: dist/*.whl
          /tmp/wheels/bin/whw --version

      - name: Record installed size and cold start
        run: |
          /tmp/wheels/bin/python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import subprocess, sys, time
          from pathlib import Path

          venv = Path(sys.prefix)
          files = [f for f in venv.rglob("*") if f.is_file() and not f.is_symlink()]
          size = sum(f.stat().st_size for f in files)
          whw = [str(venv / "bin" / "whw"), "--version"]
          subprocess.run(whw, check=True, capture_output=True)  # writes bytecode
          times = []
          for _ in range(5):
              start = time.perf_counter()
              subprocess.run(whw, check=True, capture_output=True)
              times.append(time.perf_counter() - start)
          print("| Platform | Python | Installed size | `whw --version` (best of 5) |")
          print("|---|---|---|---|")
          print(f"| ${{ matrix.os }} | ${{ matrix.python }} | {size / 2**20:.1f} MiB | {min(times) * 1000:.0f} ms |")
          EOF
