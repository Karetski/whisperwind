name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build sdist and wheel
        run: uv build

      - name: The wheel is pure Python
        run: ls dist/whisperwind-*-py3-none-any.whl

      - name: Every runtime dependency is pure Python
        run: |
          uv venv /tmp/pure
          uv pip install --python /tmp/pure dist/*.whl
          /tmp/pure/bin/python tools/check_pure_python.py

      - name: Installs with pipx
        run: |
          pipx install dist/*.whl
          whisperwind --version
          whw --version
          pipx uninstall whisperwind

      - name: Installs with uv tool
        run: |
          uv tool install dist/*.whl
          whisperwind --version
          whw --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
